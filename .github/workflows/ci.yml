name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload build for e2e
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Baselines are committed by the visual-baselines workflow. Until that
      # has been run once there is nothing to compare against, so skip rather
      # than fail — a first run would otherwise "pass" by writing its own
      # baselines, which proves nothing.
      - name: Look for committed baselines
        id: baselines
        run: |
          if [ -d frontend/e2e/__screenshots__ ] && [ -n "$(ls -A frontend/e2e/__screenshots__)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No screenshot baselines yet — run the 'Visual baselines' workflow to create them."
          fi

      - name: Install dependencies
        if: steps.baselines.outputs.found == 'true'
        run: npm ci

      - name: Download build
        if: steps.baselines.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Install Playwright browser
        if: steps.baselines.outputs.found == 'true'
        run: npx playwright install --with-deps chromium

      - name: Compare against baselines
        if: steps.baselines.outputs.found == 'true'
        run: npm run test:visual

      - name: Upload visual diff report
        if: failure() && steps.baselines.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: playwright-report
          retention-days: 7
