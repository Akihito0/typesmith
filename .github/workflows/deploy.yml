name: Deploy to GitHub Pages

# Requires Pages to be enabled once: repo Settings -> Pages -> Source:
# "GitHub Actions". The site lands at https://<owner>.github.io/typesmith/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /typesmith
          # Without this, metadataBase falls back to localhost and every
          # og:image / canonical URL in the published site points at
          # http://localhost:3000 — social previews break silently.
          # Origin only, no path: backend/site.ts explains why.
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Verify the published URLs are absolute
        run: |
          if grep -q "localhost:3000" frontend/out/index.html; then
            echo "::error::Built HTML still references localhost — NEXT_PUBLIC_SITE_URL didn't apply."
            grep -o 'content="http://localhost:3000[^"]*"' frontend/out/index.html | head -5
            exit 1
          fi
          test -f frontend/out/sitemap.xml && test -f frontend/out/robots.txt

      - name: Verify export output
        run: test -f frontend/out/index.html && test -f frontend/out/editor.html

      - uses: actions/upload-pages-artifact@v3
        with:
          # The Next root is frontend/, so the static export lands there.
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No `environment:` block on purpose: it's cosmetic (run-UI link only) and
    # editors flag the name until GitHub auto-creates the environment on first
    # deploy. The Pages deployment targets github-pages regardless.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Site URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
