name: Deploy to GitHub Pages

# Requires Pages to be enabled once: repo Settings -> Pages -> Source:
# "GitHub Actions". The site lands at https://<owner>.github.io/typesmith/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /typesmith

      - name: Verify export output
        run: test -f out/index.html && test -f out/editor.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No `environment:` block on purpose: it's cosmetic (run-UI link only) and
    # editors flag the name until GitHub auto-creates the environment on first
    # deploy. The Pages deployment targets github-pages regardless.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Site URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
