name: Visual baselines

# Screenshot baselines have to be produced on the same platform that compares
# them, and CI is Linux — a macOS dev machine physically cannot generate usable
# ones. So this is the bootstrap (and the refresh) path: run it by hand, it
# regenerates frontend/e2e/__screenshots__/ on Linux and opens a PR with the new PNGs so
# the change is reviewed like any other diff.
#
# Run it after any intentional UI change that the visual job then flags.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to regenerate baselines from"
        required: false
        default: main

jobs:
  update:
    name: Regenerate screenshot baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npm run test:visual -- --update-snapshots

      - name: Open a PR with the new baselines
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/visual-baselines
          title: "chore: refresh visual regression baselines"
          commit-message: "chore: refresh visual regression baselines"
          body: |
            Regenerated by the **Visual baselines** workflow on Linux.

            Review the image diff: every changed screenshot should correspond to
            a UI change you meant to make. If one doesn't, the visual job just
            caught a regression — fix that instead of merging this.
          add-paths: frontend/e2e/__screenshots__
